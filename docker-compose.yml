version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: vitara-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - MODEL_NAME=${MODEL_NAME:-gemini-3.5-flash-lite}
    volumes:
      - vitara-data:/app/BE/runtime
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    container_name: vitara-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - API_PROXY_TARGET=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  vitara-data:
    driver: local
